name: FocusBar

options:
  bundleIdPrefix: com.kanharithsok
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  fileTypes:
    icon:
      file: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.17.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  FocusBar:
    type: application
    platform: macOS
    sources:
      - path: FocusBar
      - path: FocusBarShared
      - path: FocusBarHelper/com.kanharithsok.FocusBar.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: KeyboardShortcuts
      - target: FocusBarHelper
        embed: true
        link: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanharithsok.FocusBar
        PRODUCT_NAME: FocusBar
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FocusBar
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "FocusBar uses Apple Events only to inspect the active tab in Safari or Google Chrome when browser protection is enabled. It does not read page content."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Kanharith Sok"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        # Keep Debug on a distinct identity so macOS gives it a fresh
        # notification-icon cache entry during development. Release keeps the
        # production bundle identifier.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kanharithsok.FocusBar.debug
    scheme:
      testTargets:
        - FocusBarTests
      gatherCoverageData: false

  # M6 privileged helper. Embedded in FocusBar.app and registered on demand
  # through SMAppService when the user enables system-wide website blocking.
  # Debug and Release share this daemon label; register only one copy at a time.
  FocusBarHelper:
    type: tool
    platform: macOS
    sources:
      - path: FocusBarHelper
        excludes:
          - "*.plist"
      - path: FocusBarShared
    settings:
      base:
        PRODUCT_NAME: FocusBarHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.kanharithsok.FocusBar.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_OUTPUT_FORMAT: binary
        SKIP_INSTALL: YES

  FocusBarUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FocusBarUITests
    dependencies:
      - target: FocusBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanharithsok.FocusBarUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FocusBar
    scheme:
      testTargets:
        - FocusBarUITests

  FocusBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FocusBarTests
    dependencies:
      - target: FocusBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanharithsok.FocusBarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FocusBar.app/Contents/MacOS/FocusBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
